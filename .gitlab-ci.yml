variables:
  CI_REGISTRY: 'gitlab.pe.gov.br:5050'
  CI_REGISTRY_IMAGE: '$CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/$CI_COMMIT_REF_NAME'

stages:
  - build-image

.rules-template: &rules-template
  - if: '$CI_COMMIT_REF_NAME == "main" || $CI_COMMIT_REF_NAME == "homolog" || $CI_COMMIT_REF_NAME == "desenv"'
    when: on_success
  - when: never

build-image:
  stage: build-image
  tags:
    - runner-docker
  rules: *rules-template
  before_script:
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN"
  script:
    - docker build --build-arg VITE_API_URL="/api" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" -f Dockerfile --output type=registry .
  when: on_success
